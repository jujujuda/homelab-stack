services:
  # ---------------------------------------------------------------------------
  # Unbound — Recursive DNS resolver (upstream for AdGuard)
  # Provides DNSSEC validation and caching, improves privacy
  # ---------------------------------------------------------------------------
  unbound:
    image: mvance/unbound:1.22.0
    container_name: unbound
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - unbound-conf:/opt/unbound/etc/unbound/unbound.conf.d/custom.conf
    ports:
      - "553:53/tcp"
      - "553:53/udp"
    healthcheck:
      test: ["CMD-SHELL", "unbound-control -c /opt/unbound/etc/unbound/unbound.conf status_nsd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # AdGuard Home — DNS sinkhole + ad blocking + DHCP
  # Upstream DNS configured to use local Unbound
  # ---------------------------------------------------------------------------
  adguardhome:
    image: adguard/adguardhome:v0.107.55
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # Use Unbound as upstream DNS server
      - DNS_UPSTREAMS=tcp://unbound:553,udp://unbound:553
    labels:
      - traefik.enable=true
      - traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.services.adguard.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      unbound:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # WireGuard Easy — WireGuard VPN with web UI
  # ARM64 compatible: linux/arm64/v8
  # ---------------------------------------------------------------------------
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - wg-easy-config:/etc/wireguard
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "51821:51821/tcp"  # Web UI
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - WG_HOST=${WG_HOST:-}
      - WG_PORT=${WG_PORT:-51820}
      - WG_PASSWORD=${WG_PASSWORD:-}
      - WG_ALLOWED_IPS=${WG_ALLOWED_IPS:-10.13.0.0/24}
      - WG_DEFAULT_ADDRESS=${WG_DEFAULT_ADDRESS:-10.13.0.x}
      - WG_MTU=${WG_MTU:-1420}
      - WG_PEERS=${WG_PEERS:-5}
      - WG_PEER_DNS=${WG_PEER_DNS:-10.13.0.1}
      - WG_ALLOW_WEBUI=${WG_ALLOW_WEBUI:-true}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wg-easy.rule=Host(`wireguard.${DOMAIN}`)"
      - traefik.http.routers.wg-easy.entrypoints=websecure
      - traefik.http.routers.wg-easy.tls=true
      - traefik.http.services.wg-easy.loadbalancer.server.port=51821
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:51821/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Cloudflare DDNS — Dynamic DNS updater via Cloudflare API
  # Runs every 5 minutes via cron, updates DNS A record on IP change
  # ARM64 compatible: linux/arm64/v8
  # ---------------------------------------------------------------------------
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.14.0
    container_name: cloudflare-ddns
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - CF_ZONE_ID=${CF_ZONE_ID:-}
      - CF_RECORD_NAME=${CF_RECORD_NAME:-${WG_HOST:-}}
      - CF_RECORD_TYPE=A
      - DETECTION_MODE=detectIPv4
      - DNS_SERVER_1=1.1.1.1
      - DNS_SERVER_2=1.0.0.1
      - PROXY=false
      - TIMEOUT=10
      - RETENTION=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8055/ || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Nginx Proxy Manager — Reverse proxy + Let's Encrypt
  # ---------------------------------------------------------------------------
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.11.3
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    ports:
      - "8181:81"
    labels:
      - traefik.enable=true
      - traefik.http.routers.npm.rule=Host(`npm.${DOMAIN}`)
      - traefik.http.routers.npm.entrypoints=websecure
      - traefik.http.routers.npm.tls=true
      - traefik.http.services.npm.loadbalancer.server.port=81
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true

volumes:
  adguard-work:
  adguard-conf:
  unbound-conf:
  wg-easy-config:
  npm-data:
  npm-letsencrypt:
